<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 저녁 메뉴 추천</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #FFF6E9 0%, #FFEBEE 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2D3436;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(255, 107, 107, 0.15);
            width: 100%;
            max-width: 440px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .tag {
            display: inline-block;
            padding: 6px 14px;
            background: #FFEAA7;
            color: #D63031;
            font-weight: 600;
            font-size: 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #2D3436;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        .subtitle {
            font-size: 15px;
            color: #636E72;
            margin-bottom: 30px;
        }

        .card-box {
            background: #FFFFFF;
            border: 2px dashed #FFEAA7;
            border-radius: 20px;
            padding: 35px 20px;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
            position: relative;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .emoji-display {
            font-size: 80px;
            line-height: 1;
            margin-bottom: 15px;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.08));
            transition: transform 0.2s ease;
        }

        .food-name {
            font-size: 24px;
            font-weight: 800;
            color: #D63031;
            min-height: 36px;
        }

        .food-category {
            font-size: 13px;
            color: #00CEC9;
            font-weight: 600;
            margin-top: 4px;
            min-height: 18px;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #FF6B6B 0%, #EE5253 100%);
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(238, 82, 83, 0.3);
            transition: all 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(238, 82, 83, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 6px 12px rgba(238, 82, 83, 0.3);
        }

        /* 애니메이션 효과 */
        .rolling {
            animation: bounce 0.15s infinite alternate;
        }

        @keyframes bounce {
            from { transform: scale(0.95) translateY(0); }
            to { transform: scale(1.05) translateY(-5px); }
        }

        .pop-in {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #B2BEC3;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="tag">오늘 저녁 해결사</span>
        <h1>오늘 뭐 먹지?</h1>
        <p class="subtitle">버튼을 눌러 오늘의 추천 메뉴를 확인하세요!</p>

        <div class="card-box" id="cardBox">
            <div class="emoji-display" id="emojiDisplay">🍽️</div>
            <div class="food-name" id="foodName">버튼을 눌러주세요!</div>
            <div class="food-category" id="foodCategory"></div>
        </div>

        <button class="btn" onclick="recommendMenu()">🎲 저녁 메뉴 추천</button>

        <footer>
            © 오늘 뭐 먹지? | 저녁 메뉴 추천
        </footer>
    </div>

    <script>
        const menuList = [
            { name: "삼겹살", emoji: "🥓", category: "한식" },
            { name: "치킨", emoji: "🍗", category: "야식/패스트푸드" },
            { name: "피자", emoji: "🍕", category: "양식" },
            { name: "떡볶이", emoji: "🥘", category: "분식" },
            { name: "초밥", emoji: "🍣", category: "일식" },
            { name: "라면", emoji: "🍜", category: "분식" },
            { name: "햄버거", emoji: "🍔", category: "패스트푸드" },
            { name: "짜장면", emoji: "🍜", category: "중식" },
            { name: "짬뽕", emoji: "🍲", category: "중식" },
            { name: "돈까스", emoji: "🍱", category: "일식" },
            { name: "파스타", emoji: "🍝", category: "양식" },
            { name: "스테이크", emoji: "🥩", category: "양식" },
            { name: "타코", emoji: "🌮", category: "남미음식" },
            { name: "카레", emoji: "🍛", category: "일식/아시안" },
            { name: "족발/보쌈", emoji: "🍖", category: "한식" },
            { name: "마라탕", emoji: "🍲", category: "중식" },
            { name: "쌀국수", emoji: "🍜", category: "아시안" },
            { name: "비빔밥", emoji: "🥣", category: "한식" },
            { name: "김치찌개", emoji: "🍲", category: "한식" },
            { name: "된장찌개", emoji: "🍲", category: "한식" },
            { name: "부대찌개", emoji: "🥘", category: "한식" },
            { name: "샌드위치", emoji: "🥪", category: "간편식" },
            { name: "샐러드", emoji: "🥗", category: "다이어트식" },
            { name: "닭갈비", emoji: "🥘", category: "한식" },
            { name: "곱창/막창", emoji: "🥘", category: "한식" }
        ];

        let isRolling = false;

        function recommendMenu() {
            if (isRolling) return;
            isRolling = true;

            const emojiDisplay = document.getElementById("emojiDisplay");
            const foodName = document.getElementById("foodName");
            const foodCategory = document.getElementById("foodCategory");

            emojiDisplay.classList.remove("pop-in");
            emojiDisplay.classList.add("rolling");
            foodName.style.opacity = "0.5";
            foodName.innerText = "메뉴 골라내는 중...";
            foodCategory.innerText = "";

            // 랜덤 이모지 롤링 효과 (1.2초)
            const interval = setInterval(() => {
                const tempIndex = Math.floor(Math.random() * menuList.length);
                emojiDisplay.innerText = menuList[tempIndex].emoji;
            }, 80);

            setTimeout(() => {
                clearInterval(interval);
                emojiDisplay.classList.remove("rolling");

                // 최종 메뉴 결정
                const finalIndex = Math.floor(Math.random() * menuList.length);
                const selected = menuList[finalIndex];

                emojiDisplay.innerText = selected.emoji;
                foodName.innerText = selected.name;
                foodCategory.innerText = `[${selected.category}]`;

                foodName.style.opacity = "1";
                emojiDisplay.classList.add("pop-in");

                isRolling = false;
            }, 1200);
        }
    </script>
</body>
</html>
